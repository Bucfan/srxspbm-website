<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a882"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded square background -->
  <rect x="1" y="1" width="30" height="30" rx="7" ry="7" fill="#0d1720" stroke="rgba(0,212,170,0.4)" stroke-width="1"/>
  <!-- Teal top accent -->
  <rect x="1" y="1" width="30" height="4" rx="4" fill="url(#tg)"/>
  <!-- Horizontal arm -->
  <rect x="6" y="14" width="20" height="5" rx="2.5" fill="rgba(0,212,170,0.2)" stroke="rgba(0,212,170,0.5)" stroke-width="0.75"/>
  <!-- Vertical arm -->
  <rect x="14" y="6" width="5" height="20" rx="2.5" fill="rgba(0,212,170,0.2)" stroke="rgba(0,212,170,0.5)" stroke-width="0.75"/>
  <!-- Center glow -->
  <rect x="14" y="14" width="5" height="5" rx="1.5" fill="url(#tg)"/>
</svg>
